name: Static Site Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required static files
        run: |
          test -f index.html
          test -f trust.html
          test -f privacy.html
          test -f terms.html
          test -f robots.txt
          test -f sitemap.xml
          test -f manifest.webmanifest
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f assets/js/citation-engine.js
          test -f assets/js/revenue-readiness.js
          test -f docs/PROJECT_CONTEXT.md
          test -f docs/EP-LEDGER.md

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/citation-engine.js
          node --check assets/js/revenue-readiness.js
          node --check tests/citation-accuracy-corpus.js

      - name: Check JSON validity
        run: |
          python -m json.tool assets/asset-version.json >/dev/null
          find assets/data -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Check browser-only architecture in runtime files
        run: |
          ! grep -RniE "express\(|app\.listen|django|flask|fastapi|sqlalchemy|sqlite|postgres|mongodb|mysql|redis|server\.js|requirements\.txt|package-lock\.json" index.html trust.html privacy.html terms.html guides assets

      - name: Check no likely secrets in runtime files
        run: |
          ! grep -RniE "api[_-]?key[[:space:]]*=|secret[[:space:]]*=|password[[:space:]]*=|private[_-]?key[[:space:]]*=|access[_-]?token[[:space:]]*=" index.html trust.html privacy.html terms.html guides assets

      - name: Check no active third-party ad script in public HTML
        run: |
          ! grep -RniE "https?://[^\"']*(googlesyndication|doubleclick|adsbygoogle|adservice)" index.html trust.html privacy.html terms.html guides
          ! grep -RniE "data-revenue-enabled=[\"']true[\"']" index.html trust.html privacy.html terms.html guides

      - name: Check asset version consistency and required scripts
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          version = json.loads(Path('assets/asset-version.json').read_text())['assetVersion']
          bad = []
          checked = []
          public_pages = [Path('index.html'), Path('privacy.html'), Path('terms.html'), Path('trust.html'), Path('404.html'), *Path('guides').glob('*.html')]
          test_pages = list(Path('tests').glob('*.html'))
          paths = public_pages + test_pages
          pattern = re.compile(r"(?:\.\./)?assets/(?:css/style\.css|js/(?:app|citation-engine|revenue-readiness)\.js)\?v=([^\"\']+)")
          for path in paths:
              text = path.read_text()
              for match in pattern.finditer(text):
                  checked.append(f'{path}:{match.group(0)}')
                  if match.group(1) != version:
                      bad.append(f'{path}: {match.group(0)}')
          if not checked:
              raise SystemExit('No versioned asset references found')
          if bad:
              raise SystemExit('Asset version mismatch: ' + '; '.join(sorted(bad)))
          for path in public_pages:
              text = path.read_text()
              prefix = '../' if str(path).startswith('guides/') else ''
              required = [f'{prefix}assets/css/style.css?v={version}', f'{prefix}assets/js/app.js?v={version}']
              if path.name == 'index.html':
                  required.append(f'{prefix}assets/js/citation-engine.js?v={version}')
                  required.append(f'{prefix}assets/js/revenue-readiness.js?v={version}')
              for ref in required:
                  if ref not in text:
                      raise SystemExit(f'Missing required asset reference in {path}: {ref}')
          PY

      - name: Check social preview fallback
        run: |
          test -f assets/og/citejury-social-preview.png
          grep -q "citejury-social-preview.png" index.html
          grep -q 'og:image:type" content="image/png"' index.html

      - name: Check EP-075A release metadata, accuracy, user-flow reliability, ad readiness, duplicate slots, and router scope
        run: |
          grep -q "EP-075A" tests/index.html
          grep -q "assetVersion: \"072\"" tests/index.html
          grep -q "EP-075A-checker-safety-hotfix.html" tests/index.html
          grep -q "AdSense activation remains approval-gated" docs/ADVERTISEMENT_ACTIVATION.md
          grep -q "EP-075A" docs/EP-LEDGER.md
          grep -q "2026-07-09" sitemap.xml
          python - <<'PY'
          from pathlib import Path
          app = Path('assets/js/app.js').read_text()
          guard = app.find('if (hasWorkspaceRouter)')
          hash_listener = app.find('window.addEventListener("hashchange", applyWorkspaceFromHash)')
          pop_listener = app.find('window.addEventListener("popstate", applyWorkspaceFromHash)')
          apply = app.find('applyWorkspaceFromHash();', guard)
          if guard == -1 or hash_listener == -1 or pop_listener == -1 or apply == -1:
              raise SystemExit('Workspace hash router gate is incomplete')
          if not (guard < hash_listener < apply and guard < pop_listener < apply):
              raise SystemExit('Workspace hash listeners must remain inside hasWorkspaceRouter guard')

          guides = sorted(Path('guides').glob('*.html'))
          missing=[]
          generic=[]
          for path in guides:
              text=path.read_text()
              for needle in ['property="og:title"', 'property="og:description"', 'property="og:image"', 'name="twitter:card"', 'name="twitter:image"']:
                  if needle not in text:
                      missing.append(f'{path}:{needle}')
              if 'CiteJury guide for' in text:
                  generic.append(str(path))
          if missing:
              raise SystemExit('Missing guide social metadata: '+'; '.join(missing))
          if generic:
              raise SystemExit('Generic guide metadata remains: '+'; '.join(generic))

          ads_config = Path('assets/data/ads-config.json').read_text()
          if '"ads_active": false' not in ads_config:
              raise SystemExit('Ads must remain disabled in EP-075A')
          homepage = Path('index.html').read_text()
          if 'googlesyndication' in homepage or 'adsbygoogle' in homepage or 'doubleclick' in homepage:
              raise SystemExit('Homepage must not include active third-party ad scripts before explicit activation')


          guide_slot_errors=[]
          for path in sorted(Path('guides').glob('*.html')):
              count = path.read_text().count('data-revenue-slot="ad-guide-footer"')
              if count != 1:
                  guide_slot_errors.append(f'{path}: expected 1 ad-guide-footer slot, found {count}')
          if guide_slot_errors:
              raise SystemExit('Guide ad slot uniqueness failed: ' + '; '.join(guide_slot_errors))

          config = __import__('json').loads(Path('assets/data/ads-config.json').read_text())
          if not config.get('ad_slot_policy', {}).get('public_pages_must_not_duplicate_slot_ids'):
              raise SystemExit('Ad slot uniqueness policy missing from ads-config.json')

          if 'Case title detected before the SCC citation' not in app:
              raise SystemExit('EP-075A SCC checker case-name recognition guard missing')
          if 'return legacyCopy();' not in app:
              raise SystemExit('EP-075A clipboard fallback retry guard missing')
          if 'window.setTimeout(() => {\n        URL.revokeObjectURL(url);' not in app:
              raise SystemExit('EP-075A delayed download cleanup guard missing')
          if 'scrollToCitationResult' not in app:
              raise SystemExit('EP-075A mobile result scroll guard missing')
          PY
