name: Static Site Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required static files
        run: |
          test -f index.html
          test -f trust.html
          test -f privacy.html
          test -f terms.html
          test -f robots.txt
          test -f sitemap.xml
          test -f manifest.webmanifest
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f assets/js/citation-engine.js
          test -f docs/PROJECT_CONTEXT.md
          test -f docs/EP-LEDGER.md

      - name: Check browser-only architecture
        run: |
          ! grep -RniE "express\(|app\.listen|django|flask|fastapi|sqlalchemy|sqlite|postgres|mongodb|mysql|redis|server\.js|requirements\.txt|package-lock\.json" . --exclude-dir=.git --exclude=static-check.yml

      - name: Check no secrets
        run: |
          ! grep -RniE "api[_-]?key|secret|password|private[_-]?key|access[_-]?token" . --exclude-dir=.git --exclude=GIT.md --exclude=static-check.yml

      - name: Check no active third-party ad script
        run: |
          ! grep -RniE "googlesyndication|doubleclick|adsbygoogle|adservice" . --exclude-dir=.git --exclude=AD_MONETIZATION.md --exclude=ads-config.json
