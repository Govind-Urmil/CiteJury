name: Static Site Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required static files
        run: |
          test -f index.html
          test -f trust.html
          test -f privacy.html
          test -f terms.html
          test -f robots.txt
          test -f sitemap.xml
          test -f manifest.webmanifest
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f assets/js/citation-engine.js
          test -f docs/PROJECT_CONTEXT.md
          test -f docs/EP-LEDGER.md

      - name: Check browser-only architecture in runtime files
        run: |
          ! grep -RniE "express\(|app\.listen|django|flask|fastapi|sqlalchemy|sqlite|postgres|mongodb|mysql|redis|server\.js|requirements\.txt|package-lock\.json" index.html trust.html privacy.html terms.html guides assets

      - name: Check no likely secrets in runtime files
        run: |
          ! grep -RniE "api[_-]?key[[:space:]]*=|secret[[:space:]]*=|password[[:space:]]*=|private[_-]?key[[:space:]]*=|access[_-]?token[[:space:]]*=" index.html trust.html privacy.html terms.html guides assets

      - name: Check no active third-party ad script in runtime files
        run: |
          ! grep -RniE "googlesyndication|doubleclick|adsbygoogle|adservice" index.html trust.html privacy.html terms.html guides assets
