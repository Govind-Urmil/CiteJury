<!doctype html>
<meta charset="utf-8">
<title>EP-075 Citation Doctor Accuracy & Final UI Polish</title>
<h1>EP-075 Citation Doctor Accuracy & Final UI Polish</h1>
<pre id="results">Running…</pre>
<script src="../assets/js/citation-engine.js?v=075"></script>
<script src="../assets/js/app.js?v=075"></script>
<script>
const results = [];
const pass = (name, ok, detail = "") => results.push(`${ok ? "PASS" : "FAIL"}: ${name}${detail ? " — " + detail : ""}`);
const engine = window.CiteJuryCitationEngine;
pass("citation engine loaded", !!engine);

if (engine) {
  const indian = engine.generate({
    citationStyle: "indian-legal",
    sourceType: "judgment",
    title: "Kesavananda Bharati",
    year: "1973",
    volume: "4",
    reporter: "SCC",
    page: "225",
    court: ""
  });
  pass("Indian Legal judgment preserves volume", indian.ok && /\(1973\) 4 SCC 225/.test(indian.citation), indian.citation || indian.error || "");

  const scc = engine.generate({
    citationStyle: "scc",
    sourceType: "judgment",
    title: "Case Name",
    year: "2017",
    volume: "10",
    reporter: "SCC",
    page: "1",
    court: ""
  });
  pass("SCC generator still includes volume", scc.ok && /\(2017\) 10 SCC 1/.test(scc.citation), scc.citation || scc.error || "");

  const oscola = engine.generate({
    citationStyle: "oscola",
    sourceType: "judgment",
    title: "Donoghue v Stevenson",
    year: "1932",
    reporter: "AC",
    volume: "",
    page: "562",
    court: "HL"
  });
  pass("OSCOLA fresh generation has no stale SCC volume", oscola.ok && !/\[1932\]\s+10\s+AC/.test(oscola.citation), oscola.citation || oscola.error || "");
}

const source = document.documentElement.outerHTML;
pass("test page asset references use 073b", source.includes("?v=075") && !source.includes("?v=075") && !source.includes("?v=075"));

document.querySelector("#results").textContent = results.join("\n");
document.documentElement.dataset.testStatus = results.some((line) => line.startsWith("FAIL")) ? "fail" : "pass";
</script>
