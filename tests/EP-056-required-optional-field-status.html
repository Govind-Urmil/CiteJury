<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EP-056 Required Optional Field Status Checks</title></head>
<body><pre id="results"></pre>
<script src="../assets/js/citation-engine.js?v=075a"></script>
<script>
const checks = [
  ["getRuleSpec is exposed", typeof window.CiteJuryCitationEngine.getRuleSpec === "function"],
  ["SCI neutral citation marks page/sequence required", window.CiteJuryCitationEngine.getRuleSpec({citationStyle:"indian-legal",sourceType:"sc-neutral-judgment"}).required.includes("page")],
  ["default rule remains available", Array.isArray(window.CiteJuryCitationEngine.getRuleSpec({citationStyle:"unknown",sourceType:"unknown"}).required)]
];
document.getElementById("results").textContent = checks.map(([name, ok]) => `${ok ? "PASS" : "FAIL"}: ${name}`).join("\n");
</script></body></html>
