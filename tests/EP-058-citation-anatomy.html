<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EP-058 Citation Anatomy Checks</title></head>
<body><pre id="results"></pre>
<script src="../assets/js/citation-engine.js?v=075"></script>
<script>
const result = window.CiteJuryCitationEngine.generate({
  citationStyle:"indian-legal",
  sourceType:"sc-neutral-judgment",
  title:"Example v Union of India",
  year:"2023",
  page:"154"
});
const checks = [
  ["neutral citation generates", result.ok],
  ["expected citation token", result.citation.includes("2023 INSC 154")],
  ["engine still static/browser-only", !("fetch" in result)]
];
document.getElementById("results").textContent = checks.map(([name, ok]) => `${ok ? "PASS" : "FAIL"}: ${name}`).join("\n");
</script></body></html>
