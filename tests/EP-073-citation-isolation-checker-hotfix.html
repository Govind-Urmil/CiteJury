<!doctype html><meta charset="utf-8"><title>EP-074 Hotfix Gate</title>
<h1>EP-074 Hotfix Gate</h1><pre id="results"></pre>
<script src="../assets/js/citation-engine.js?v=074"></script>
<script>
const out=[]; const assert=(name,ok)=>out.push(`${ok?"PASS":"FAIL"}: ${name}`);
const e=window.CiteJuryCitationEngine;
assert("engine loaded",!!e);
if(e){
 const r=e.generate({citationStyle:"indian-legal",sourceType:"judgment",title:"Kesavananda Bharati",year:"1973",volume:"4",reporter:"SCC",page:"225",court:""});
 assert("Indian Legal judgment preserves volume",r.ok && /\(1973\) 4 SCC 225/.test(r.citation));
}
document.querySelector("#results").textContent=out.join("\n");
if(out.some(x=>x.startsWith("FAIL"))) document.documentElement.dataset.testStatus="fail";
else document.documentElement.dataset.testStatus="pass";
</script>
