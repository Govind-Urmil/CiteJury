<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EP-037 Content Quality Test</title><link rel="stylesheet" href="../assets/css/style.css?v=079"></head><body><main class="container section"><h1>EP-037 Content Quality Test</h1><pre id="out">Running...</pre></main><script>
const guides = [
'legal-citation-basics.html','indian-legal-citation.html','how-to-cite-supreme-court-judgment.html','how-to-cite-high-court-judgment.html','how-to-cite-bare-act.html','how-to-cite-constitution-of-india.html','scc-citation.html','air-citation.html','oscola-citation-guide-india.html','bluebook-citation-basics-india.html','how-to-cite-law-journal-article.html','how-to-cite-legal-website.html','how-to-cite-online-judgment.html','legal-citation-for-law-students.html','moot-court-memorial-citation-guide.html'];
(async()=>{const results=[]; for (const g of guides){const r=await fetch('../guides/'+g); const t=await r.text(); const checks=[['status',r.ok],['trust note',t.includes('Trust-first note')],['generator link',t.includes('../index.html#generator')],['ad readiness hidden',t.includes('data-revenue-slot="ad-guide-footer"') && t.includes('hidden aria-label="Advertisement area"')],['not template generic',!t.includes('Start with the source</h2><p>Identify the authority accurately before formatting the citation. Record the title, author or parties')],['length',t.length>2800]]; results.push({g,checks});} const failed=[]; for (const row of results){for (const [name,ok] of row.checks){if(!ok) failed.push(row.g+': '+name)}} document.getElementById('out').textContent = failed.length ? 'FAILED\n'+failed.join('\n') : 'PASSED '+guides.length+'/'+guides.length+' guide content checks'; if(failed.length) throw new Error(failed.join('; '));})();
</script></body></html>
